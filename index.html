<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Necesito a un contador? | La Conta</title>
<meta name="description" content="Ocho preguntas y te digo si ya necesitas a tu conta. Por @la_contaa.">
<meta name="theme-color" content="#4A0E23">
<meta property="og:type" content="website">
<meta property="og:title" content="¿Necesito a un contador?">
<meta property="og:description" content="Ocho preguntas y te digo si ya necesitas a tu conta. Por @la_contaa.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#4A0E23;
  --wine-2:#5C1430;
  --cream:#F4EEE4;
  --paper:#FBF8F2;
  --ink:#2B0A15;
  --ink-2:#5A3A45;
  --pink:#FF4FA3;
  --pink-d:#BE0F5E;
  --on-wine:#EBD9DF;
  --line:rgba(43,10,21,.22);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--wine)}
body{margin:0;background:var(--wine);color:var(--on-wine);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:10px;border:1px solid rgba(255,79,163,.55);border-radius:4px;pointer-events:none}
.app{
  position:relative;max-width:500px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:
    calc(26px + env(safe-area-inset-top,0px))
    calc(26px + env(safe-area-inset-right,0px))
    calc(24px + env(safe-area-inset-bottom,0px))
    calc(26px + env(safe-area-inset-left,0px));
}
header{display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-wine)}
.top b{font-weight:700;color:var(--pink)}
#count{font-variant-numeric:tabular-nums}
.segs{display:flex;gap:4px;transition:opacity 200ms var(--ease-out)}
.segs[data-off]{opacity:0}
.seg{flex:1;height:4px;border-radius:2px;background:rgba(235,217,223,.2);position:relative;overflow:hidden}
.seg::after{content:"";position:absolute;inset:0;background:var(--pink);transform:scaleX(0);transform-origin:left;transition:transform 260ms var(--ease-out)}
.seg.on::after{transform:scaleX(1)}
.seg.cur::after{transform:scaleX(.4);opacity:.6}

main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0}
.screen{display:flex;flex-direction:column;align-items:stretch}
.rise{opacity:0;transform:translateY(10px);transition:opacity 280ms var(--ease-out),transform 280ms var(--ease-out);transition-delay:calc(var(--i,0) * 45ms)}
.screen[data-in] .rise{opacity:1;transform:none}

.card{
  position:relative;background:var(--cream);color:var(--ink);border-radius:16px;padding:30px 22px 24px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .15  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  box-shadow:0 24px 40px -26px rgba(0,0,0,.6);
}
.seal ~ .kicker{padding-right:62px}
.kicker{margin:0 0 12px;font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pink-d)}
h1,h2{margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(36px,10.4vw,46px);line-height:1.06}
h1 em,h2 em{font-style:italic;font-weight:700;color:var(--pink-d)}
h2.q{font-size:clamp(25px,7vw,31px);line-height:1.18;margin-bottom:20px;outline:none}
.lead{margin:14px 0 24px;font-size:18px;color:var(--ink-2);max-width:32ch}

button,.btn{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.item{margin:0 0 9px}
.opt{
  width:100%;min-height:56px;display:flex;align-items:center;gap:13px;text-align:left;color:var(--ink);
  padding:12px 14px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;font-weight:500;line-height:1.3;
  transition:transform 140ms var(--ease-out),background-color 140ms ease,border-color 140ms ease,color 140ms ease;
}
.opt .k{
  flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--pink-d);color:var(--pink-d);
  display:grid;place-items:center;font-size:14px;font-weight:700;
  transition:background-color 140ms ease,border-color 140ms ease,color 140ms ease;
}
.opt span:last-child{flex:1;min-width:0}
.opt:active{transform:scale(.98)}
.opt.sel{background:var(--pink-d);border-color:var(--pink-d);color:#fff}
.opt.sel .k{border-color:#fff;color:#fff}

.btn{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:14px 20px;border-radius:12px;
  font-weight:700;font-size:18px;text-decoration:none;background:var(--pink-d);color:#fff;border:1.5px solid var(--pink-d);
  transition:transform 140ms var(--ease-out),background-color 140ms ease;
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--on-wine);border-color:rgba(235,217,223,.4);font-weight:500;font-size:17px}
.btn.ghost:focus-visible,.back:focus-visible{outline-color:var(--pink)}

.back{
  align-self:flex-start;min-height:44px;margin:8px 0 0 -6px;padding:0 12px 0 6px;display:inline-flex;align-items:center;gap:6px;
  background:none;border:0;color:var(--on-wine);font-size:15px;border-radius:10px;
  transition:transform 140ms var(--ease-out),color 140ms ease;
}
.back:active{transform:scale(.97)}
.back svg{width:18px;height:18px}
.below{margin-top:12px}

.seal{
  position:absolute;top:-22px;right:18px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-style:italic;font-weight:700;font-size:24px;color:#F4D9DE;transform:rotate(-10deg);
  background:radial-gradient(circle at 34% 30%,#B3173A 0%,#7A0B24 58%,#5E0A1D 100%);
  box-shadow:0 6px 12px -4px rgba(0,0,0,.5),inset 0 0 0 4px rgba(94,10,29,.55),inset 0 0 0 5px rgba(244,217,222,.25);
}
.screen .seal{opacity:0;transform:rotate(-18deg) scale(1.18);transition:opacity 260ms var(--ease-out),transform 320ms var(--ease-out);transition-delay:140ms}
.screen[data-in] .seal{opacity:1;transform:rotate(-10deg)}

.result h2{font-size:clamp(28px,8vw,36px);line-height:1.12}
.sub{margin:14px 0 0;color:var(--ink-2);font-size:17px}
.todo{list-style:none;margin:10px 0 0;padding:0}
.todo li{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px dashed rgba(43,10,21,.28);font-size:17px;line-height:1.3}
.todo li:last-child{border-bottom:1px dashed rgba(43,10,21,.28)}
.todo b{flex:none;font-family:var(--display);font-style:italic;color:var(--pink-d);font-size:19px;min-width:26px}
.dm{margin-top:22px}
.dm p{margin:0 0 10px;font-weight:700;font-size:17px}

footer{font-size:12.5px;line-height:1.4;color:rgba(235,217,223,.78);text-align:center;padding-top:6px}

@media (hover:hover) and (pointer:fine){
  .opt:hover{border-color:var(--pink-d);background:#fff}
  .opt.sel:hover{background:var(--pink-d)}
  .btn:hover{background:#A00D52}
  .btn.ghost:hover{background:rgba(235,217,223,.1);border-color:rgba(235,217,223,.7)}
  .back:hover{color:#fff}
}
@media (prefers-reduced-motion:reduce){
  .rise,.screen .seal{transform:none;transition:opacity 200ms ease;transition-delay:0ms}
  .screen[data-in] .seal{transform:rotate(-10deg)}
  .screen .seal{transform:rotate(-10deg)}
  .seg::after{transition:none}
  .opt:active,.btn:active,.back:active{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top"><b>La Conta</b><span id="count" aria-live="polite"></span></div>
    <div class="segs" id="segs" data-off aria-hidden="true"></div>
  </header>
  <main id="body"></main>
  <footer>Cuestionario orientativo para México. No sustituye la asesoría de un contador.</footer>
</div>
<noscript><p style="padding:24px">Este cuestionario necesita JavaScript para funcionar.</p></noscript>
<script>
var Q=[
{q:"¿Tienes RFC?",o:[["Sí, ya tengo",0,""],["No tengo",2,"inscripción en el SAT (RFC)"],["No estoy seguro",1,"confirmar tu situación en el SAT"]]},
{q:"¿Cuentas con firma electrónica (e.firma) vigente?",o:[["Sí, vigente",0,""],["No tengo",2,"tramitar tu e.firma"],["Está vencida o no sé",2,"renovar o revisar tu e.firma"]]},
{q:"¿A qué te dedicas?",o:[["Soy empleado con sueldo",0,"","emp"],["Freelance o servicios profesionales",2,"definir tu régimen fiscal"],["Vendo productos o tengo un negocio",2,"definir tu régimen fiscal"],["Rento inmuebles",2,"declarar tus rentas"],["Vendo o presto servicios por plataformas",2,"declarar tus ingresos digitales"],["Tengo una empresa o sociedad",4,"contabilidad formal de empresa"]]},
{q:"¿Emites facturas (CFDI)?",o:[["Sí, con frecuencia",2,"emisión y control de facturas"],["A veces",1,"emisión y control de facturas"],["No emito",0,""]]},
{q:"¿Cuáles son tus ingresos anuales aproximados?",o:[["Menos de $300,000",0,""],["Entre $300,000 y $3.5 millones",1,"declaraciones periódicas"],["Más de $3.5 millones",3,"contabilidad y declaraciones completas"]]},
{q:"¿Tienes empleados a tu cargo?",o:[["Sí",3,"nómina, IMSS y retenciones"],["No",0,""]]},
{q:"¿Estás al corriente con tus declaraciones?",o:[["Sí, al corriente",0,""],["Tengo atrasos",3,"regularizar declaraciones atrasadas"],["No sé si tengo que declarar",2,"revisar tus obligaciones fiscales"]]},
{q:"¿Has recibido algún requerimiento o aviso del SAT?",o:[["Sí",4,"atender el requerimiento del SAT"],["No",0,""]]}
];
var DM_URL="https://ig.me/m/la_contaa";
var i=0,score=0,needs=[],emp=false,hist=[],lock=false;
var body=document.getElementById('body'),countEl=document.getElementById('count'),segsEl=document.getElementById('segs');
var segs=Q.map(function(){var s=document.createElement('span');s.className='seg';segsEl.appendChild(s);return s;});
var ICON_BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
function pad(n){return (n<10?'0':'')+n;}
function progress(done,cur){
  segsEl.toggleAttribute('data-off',done<0);
  segs.forEach(function(s,k){s.className='seg'+(k<done?' on':(k===cur?' cur':''));});
}
function mount(html,focusSel){
  body.innerHTML='<div class="screen">'+html+'</div>';
  var s=body.firstChild;void s.offsetWidth;s.setAttribute('data-in','');
  if(focusSel){var f=s.querySelector(focusSel);if(f)f.focus({preventScroll:true});}
  window.scrollTo(0,0);
}
function intro(){
  countEl.textContent='';progress(-1,-1);
  mount(
    '<div class="card rise" style="--i:0"><div class="seal" aria-hidden="true">LC</div>'+
    '<p class="kicker">Asunto: tus impuestos</p>'+
    '<h1>¿Necesito a un <em>contador</em>?</h1>'+
    '<p class="lead">Hello!!! Soy tu conta de confianza. Contesta ocho preguntas y te digo si ya necesitas una.</p>'+
    '<button class="btn" data-start="1">Empezar</button></div>'
  );
}
function show(focus){
  lock=false;
  countEl.textContent=pad(i+1)+' / '+pad(Q.length);
  progress(i,i);
  var h='<div class="card rise" style="--i:0"><p class="kicker">Pregunta '+pad(i+1)+'</p><h2 class="q" tabindex="-1">'+Q[i].q+'</h2>';
  Q[i].o.forEach(function(o,k){
    h+='<div class="item rise" style="--i:'+(k+1)+'"><button class="opt" data-k="'+k+'"><span class="k" aria-hidden="true">'+String.fromCharCode(65+k)+'</span><span>'+o[0]+'</span></button></div>';
  });
  h+='</div>';
  if(i>0)h+='<button class="back rise" style="--i:'+(Q[i].o.length+1)+'" data-back="1">'+ICON_BACK+'Atrás</button>';
  mount(h,focus?'h2.q':null);
}
function result(){
  lock=false;
  countEl.textContent='Listo';progress(Q.length,-1);
  var yes=score>=3&&!(emp&&score<5);
  var seen={},list=[];
  needs.forEach(function(n){if(!seen[n]){seen[n]=1;list.push(n)}});
  var h='<div class="card result rise" style="--i:0"><div class="seal" aria-hidden="true">LC</div>';
  h+='<p class="kicker">Resultado</p>';
  h+='<h2 tabindex="-1">'+(yes?'Sí necesitas atención de un contador':'Por ahora no necesitas un contador')+'</h2>';
  if(yes&&list.length){
    h+='<p class="sub">Lo que te toca resolver:</p><ol class="todo">';
    list.slice(0,4).forEach(function(n,k){h+='<li><b>'+pad(k+1)+'</b><span>'+n+'</span></li>';});
    h+='</ol>';
  }else if(!yes){
    h+='<p class="sub">Si tu situación cambia, vuelve a hacer el cuestionario.</p>';
  }
  h+='<div class="dm"><p>¿Dudas? Consultas x DM.</p><a class="btn" href="'+DM_URL+'" target="_blank" rel="noopener">Escríbeme por DM</a></div></div>';
  h+='<button class="btn ghost below rise" style="--i:2" data-restart="1">Repetir cuestionario</button>';
  mount(h,'h2');
}
body.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.start){i=0;score=0;needs=[];emp=false;hist=[];show(false);return;}
  if(lock)return;
  if(t.dataset.restart){i=0;score=0;needs=[];emp=false;hist=[];show(true);return;}
  if(t.dataset.back){var p=hist.pop();i=p.i;score=p.score;needs=p.needs;emp=p.emp;show(true);return;}
  if(t.dataset.k===undefined)return;
  lock=true;t.classList.add('sel');
  var o=Q[i].o[+t.dataset.k];
  hist.push({i:i,score:score,needs:needs.slice(),emp:emp});
  score+=o[1];if(o[2])needs.push(o[2]);if(o[3])emp=true;
  setTimeout(function(){
    i++;
    if(i>=Q.length)result();else show(true);
  },170);
});
intro();
</script>
</body>
</html>
