<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Necesito a un contador?</title>
<meta name="description" content="Ocho preguntas, menos de un minuto. Descubre si necesitas a un contador en México.">
<meta name="theme-color" content="#F2F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="¿Necesito a un contador?">
<meta property="og:description" content="Ocho preguntas, menos de un minuto. Descubre si necesitas a un contador en México.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{
  /* color */
  --bg:#F2F2EF;
  --surface:#FBFBF9;
  --ink:#17171C;
  --muted:#5C5C66;
  --line:rgba(23,23,28,.2);
  --line-soft:rgba(23,23,28,.1);
  --accent:#C4144F;      /* rosa mexicano, profundo para contraste AA */
  --on-accent:#FBFBF9;
  --focus:#C4144F;

  /* type */
  --font:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  /* shape: un solo radio para controles, otro para paneles */
  --r-ctl:12px;
  --r-panel:18px;

  /* motion */
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --t-press:140ms;
  --t-state:180ms;
  --t-enter:240ms;
  --t-reveal:340ms;
  --stagger:40ms;

  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131316;
    --surface:#1C1C21;
    --ink:#EEEEF0;
    --muted:#A1A1AA;
    --line:rgba(238,238,240,.22);
    --line-soft:rgba(238,238,240,.1);
    --accent:#FF6B9A;
    --on-accent:#131316;
    --focus:#FF6B9A;
  }
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:17px;line-height:1.5;
  font-optical-sizing:auto;
  -webkit-tap-highlight-color:transparent;
}
.app{
  max-width:520px;margin:0 auto;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:
    calc(16px + env(safe-area-inset-top,0px))
    calc(20px + env(safe-area-inset-right,0px))
    calc(16px + env(safe-area-inset-bottom,0px))
    calc(20px + env(safe-area-inset-left,0px));
}
@media (max-width:359px){
  .app{padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px))}
}

/* ===== Header ===== */
header{display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:28px}
.mark{font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1}
.mark i{font-style:normal;color:var(--accent)}
#count{font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#count b{color:var(--ink);font-weight:700}

.segs{display:flex;gap:4px;transition:opacity var(--t-state) var(--ease-out)}
.segs[data-off]{opacity:0}
.seg{flex:1;height:3px;border-radius:2px;background:var(--line-soft);position:relative;overflow:hidden}
.seg::after{
  content:"";position:absolute;inset:0;background:var(--ink);
  transform:scaleX(0);transform-origin:left;
  transition:transform 280ms var(--ease-out),background-color var(--t-state) ease;
}
.seg.on::after{transform:scaleX(1)}
.seg.cur::after{transform:scaleX(1);background:var(--accent)}

/* ===== Screens ===== */
main{flex:1;display:flex;flex-direction:column;padding:28px 0 20px}
.screen{flex:1;display:flex;flex-direction:column}
.rise{
  opacity:0;transform:translateY(8px);
  transition:opacity var(--t-enter) var(--ease-out),transform var(--t-enter) var(--ease-out);
  transition-delay:calc(var(--i,0) * var(--stagger));
}
.screen[data-in] .rise{opacity:1;transform:none}

h1,h2{margin:0;font-weight:750;text-wrap:balance;letter-spacing:-.025em}
h2{outline:none}

/* ===== Intro ===== */
.intro{justify-content:space-between;gap:32px}
h1{font-size:clamp(44px,13.5vw,68px);line-height:.98;font-variation-settings:"opsz" 96}
h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:19px;line-height:1.45;color:var(--muted);margin:18px 0 0;max-width:28ch}
.facts{
  display:grid;grid-template-columns:repeat(3,1fr);
  margin:0 0 20px;padding:0;list-style:none;
  border-top:1px solid var(--line);
}
.facts li{padding:12px 8px 0 0;font-size:14px;line-height:1.3;color:var(--muted)}
.facts li+li{padding-left:12px;border-left:1px solid var(--line-soft)}
.facts b{display:block;font-size:22px;line-height:1.1;color:var(--ink);font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ===== Question ===== */
h2.q{font-size:clamp(28px,8.2vw,36px);line-height:1.1;margin-bottom:24px;font-variation-settings:"opsz" 72}
.opts{display:flex;flex-direction:column;gap:8px}

button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.opt{
  width:100%;min-height:58px;display:flex;align-items:center;gap:14px;text-align:left;
  padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);
  font-size:17px;line-height:1.3;font-weight:500;
  transition:
    transform var(--t-press) var(--ease-out),
    opacity var(--t-state) var(--ease-out),
    background-color var(--t-press) ease,
    border-color var(--t-press) ease,
    color var(--t-press) ease;
}
.opt .k{
  flex:none;width:30px;height:30px;border-radius:8px;
  display:grid;place-items:center;
  font-size:14px;font-weight:700;color:var(--muted);
  background:var(--bg);box-shadow:inset 0 0 0 1px var(--line-soft);
  transition:background-color var(--t-press) ease,color var(--t-press) ease,box-shadow var(--t-press) ease;
}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt:active{transform:scale(.98)}
.opt.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.sel .k{background:var(--on-accent);color:var(--accent);box-shadow:none}
/* al elegir, el resto se apaga: confirma la elección sin esperar al cambio de pantalla */
.opts[data-picked] .opt:not(.sel){opacity:.35}

.back{
  min-height:44px;margin:16px 0 0 -10px;padding:0 14px 0 10px;
  display:inline-flex;align-items:center;gap:10px;
  background:none;border:0;border-radius:var(--r-ctl);
  color:var(--muted);font-size:16px;font-weight:600;
  transition:transform var(--t-press) var(--ease-out),color var(--t-press) ease;
}
.back::before{
  content:"";width:8px;height:8px;
  border-left:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg);margin-top:1px;
}
.back:active{transform:scale(.97)}

/* ===== Buttons ===== */
.btn{
  width:100%;min-height:56px;padding:14px 20px;border-radius:var(--r-ctl);
  font-weight:700;font-size:18px;letter-spacing:-.01em;
  background:var(--ink);color:var(--bg);border:1px solid var(--ink);
  transition:transform var(--t-press) var(--ease-out),background-color var(--t-press) ease,border-color var(--t-press) ease;
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:600;font-size:17px}
.btn .lbl{display:inline-block;transition:opacity var(--t-state) ease,filter var(--t-state) ease}
.btn .lbl.swap{opacity:0;filter:blur(2px)}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:28px}

/* ===== Result ===== */
.verdict{overflow:hidden;line-height:.9;padding-bottom:4px;margin:0 0 6px}
.verdict span{
  display:block;font-size:clamp(96px,32vw,148px);font-weight:800;letter-spacing:-.06em;
  font-variation-settings:"opsz" 96;color:var(--ink);
  transform:translateY(100%);
  transition:transform var(--t-reveal) var(--ease-out);
}
.verdict.yes span{color:var(--accent)}
.screen[data-in] .verdict span{transform:none}
.res h2{font-size:clamp(26px,7.4vw,32px);line-height:1.12}
.res .note{margin:12px 0 0;font-size:17px;color:var(--muted);max-width:32ch}

.todo{margin-top:24px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-panel);padding:16px 16px 6px}
.todo p{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--muted)}
.todo ol{margin:0;padding:0;list-style:none;counter-reset:n}
.todo li{
  counter-increment:n;display:flex;gap:12px;align-items:baseline;
  padding:12px 0;font-size:17px;line-height:1.3;font-weight:500;
}
.todo li+li{border-top:1px solid var(--line-soft)}
.todo li::before{
  content:counter(n,decimal-leading-zero);flex:none;
  font-size:14px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;
}

/* ===== Footer ===== */
footer{font-size:13px;line-height:1.4;color:var(--muted);padding-top:4px;max-width:44ch}

/* ===== Hover (solo punteros finos) ===== */
@media (hover:hover) and (pointer:fine){
  .opt:hover{border-color:var(--ink)}
  .opt.sel:hover{border-color:var(--accent)}
  .btn:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.ghost:hover{background:var(--surface);border-color:var(--ink);color:var(--ink)}
  .back:hover{color:var(--ink)}
}

/* ===== Movimiento reducido: solo opacidad, sin desplazamientos ===== */
@media (prefers-reduced-motion:reduce){
  .rise{transform:none;transition:opacity 160ms ease;transition-delay:0ms}
  .verdict span{transform:none;transition:none}
  .seg::after{transition:none}
  .opt:active,.btn:active,.back:active{transform:none}
  .btn .lbl.swap{filter:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top"><span class="mark" aria-hidden="true">¿Conta<i>dor</i>?</span><span id="count" aria-live="polite"></span></div>
    <div class="segs" id="segs" data-off aria-hidden="true"></div>
  </header>
  <main id="body" aria-live="polite"></main>
  <footer>Cuestionario orientativo para México. No sustituye la asesoría de un contador.</footer>
</div>
<noscript><p style="padding:24px">Este cuestionario necesita JavaScript para funcionar.</p></noscript>
<script>
var Q=[
{q:"¿Tienes RFC?",o:[["Sí, ya tengo",0,""],["No tengo",2,"inscripción en el SAT (RFC)"],["No estoy seguro",1,"confirmar tu situación en el SAT"]]},
{q:"¿Cuentas con firma electrónica (e.firma) vigente?",o:[["Sí, vigente",0,""],["No tengo",2,"tramitar tu e.firma"],["Está vencida o no sé",2,"renovar o revisar tu e.firma"]]},
{q:"¿A qué te dedicas?",o:[["Soy empleado con sueldo",0,"","emp"],["Freelance o servicios profesionales",2,"definir tu régimen fiscal"],["Vendo productos o tengo un negocio",2,"definir tu régimen fiscal"],["Rento inmuebles",2,"declarar tus rentas"],["Vendo o presto servicios por plataformas",2,"declarar tus ingresos digitales"],["Tengo una empresa o sociedad",4,"contabilidad formal de empresa"]]},
{q:"¿Emites facturas (CFDI)?",o:[["Sí, con frecuencia",2,"emisión y control de facturas"],["A veces",1,"emisión y control de facturas"],["No emito",0,""]]},
{q:"¿Cuáles son tus ingresos anuales aproximados?",o:[["Menos de $300,000",0,""],["Entre $300,000 y $3.5 millones",1,"declaraciones periódicas"],["Más de $3.5 millones",3,"contabilidad y declaraciones completas"]]},
{q:"¿Tienes empleados a tu cargo?",o:[["Sí",3,"nómina, IMSS y retenciones"],["No",0,""]]},
{q:"¿Estás al corriente con tus declaraciones?",o:[["Sí, al corriente",0,""],["Tengo atrasos",3,"regularizar declaraciones atrasadas"],["No sé si tengo que declarar",2,"revisar tus obligaciones fiscales"]]},
{q:"¿Has recibido algún requerimiento o aviso del SAT?",o:[["Sí",4,"atender el requerimiento del SAT"],["No",0,""]]}
];
var i=0,score=0,needs=[],emp=false,hist=[],lock=false;
var body=document.getElementById('body'),countEl=document.getElementById('count'),segsEl=document.getElementById('segs');
var segs=Q.map(function(){var s=document.createElement('span');s.className='seg';segsEl.appendChild(s);return s;});

function progress(done,cur){
  segsEl.toggleAttribute('data-off',done<0);
  segs.forEach(function(s,k){s.className='seg'+(k<done?' on':(k===cur?' cur':''));});
}
function mount(html,focusSel,cls){
  body.innerHTML='<div class="screen'+(cls?' '+cls:'')+'">'+html+'</div>';
  var s=body.firstChild;void s.offsetWidth;s.setAttribute('data-in','');
  if(focusSel){var f=s.querySelector(focusSel);if(f)f.focus({preventScroll:true});}
  window.scrollTo(0,0);
}
function rise(n,cls){return ' class="rise'+(cls?' '+cls:'')+'" style="--i:'+n+'"';}
function pad(n){return (n<10?'0':'')+n;}

function intro(){
  countEl.textContent='';progress(-1,-1);
  mount(
    '<div>'+
      '<h1'+rise(0)+'>¿Necesito a un <em>contador</em>?</h1>'+
      '<p'+rise(1,'lead')+'>Responde ocho preguntas y te digo si te conviene o no.</p>'+
    '</div>'+
    '<div>'+
      '<ul'+rise(2,'facts')+'>'+
        '<li><b>8</b>preguntas</li>'+
        '<li><b>1 min</b>o menos</li>'+
        '<li><b>0</b>datos guardados</li>'+
      '</ul>'+
      '<div'+rise(3)+'><button class="btn" data-start="1">Empezar</button></div>'+
    '</div>',
    null,'intro'
  );
}
function show(focus){
  lock=false;
  countEl.innerHTML='<b>'+pad(i+1)+'</b> / '+pad(Q.length);
  progress(i,i);
  var h='<h2 class="q rise" style="--i:0" tabindex="-1">'+Q[i].q+'</h2><div class="opts">';
  Q[i].o.forEach(function(o,k){
    h+='<div'+rise(k+1)+'><button class="opt" data-k="'+k+'"><span class="k" aria-hidden="true">'+String.fromCharCode(65+k)+'</span><span class="t">'+o[0]+'</span></button></div>';
  });
  h+='</div>';
  if(i>0)h+='<div'+rise(Q[i].o.length+1)+'><button class="back" data-back="1">Atrás</button></div>';
  mount(h,focus?'h2.q':null);
}
function result(){
  lock=false;
  countEl.textContent='Resultado';progress(Q.length,-1);
  var yes=score>=3&&!(emp&&score<5);
  var seen={},list=[];
  needs.forEach(function(n){if(!seen[n]){seen[n]=1;list.push(n)}});
  var h='<div class="verdict '+(yes?'yes':'no')+'" aria-hidden="true"><span>'+(yes?'Sí.':'No.')+'</span></div>';
  h+='<h2'+rise(1)+' tabindex="-1">'+(yes?'Sí necesitas atención de un contador':'Por ahora no necesitas un contador')+'</h2>';
  if(yes&&list.length){
    h+='<div'+rise(2,'todo')+'><p>Lo que te toca resolver:</p><ol>';
    list.slice(0,4).forEach(function(n){h+='<li>'+n+'</li>';});
    h+='</ol></div>';
  }else if(!yes){
    h+='<p'+rise(2,'note')+'>Si tu situación cambia, vuelve a hacer el cuestionario.</p>';
  }
  h+='<div'+rise(3,'stack')+'>';
  if(navigator.share||navigator.clipboard)h+='<button class="btn" data-share="1"><span class="lbl">Compartir</span></button>';
  h+='<button class="btn ghost" data-restart="1">Repetir cuestionario</button></div>';
  mount(h,'h2','res');
}
function flash(btn,msg){
  var l=btn.querySelector('.lbl')||btn,old=l.textContent;
  var swap=function(t){l.classList.add('swap');setTimeout(function(){l.textContent=t;l.classList.remove('swap');},120);};
  swap(msg);
  setTimeout(function(){swap(old);},1800);
}
function share(btn){
  var url=location.href.split('#')[0];
  var text='Hice el cuestionario «¿Necesito a un contador?». Haz el tuyo:';
  var p=navigator.share?navigator.share({title:document.title,text:text,url:url}):Promise.reject();
  p.catch(function(e){
    if(e&&e.name==='AbortError')return;
    return navigator.clipboard.writeText(url).then(function(){flash(btn,'Enlace copiado');});
  }).catch(function(){flash(btn,'Copia el enlace desde la barra');});
}
body.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.start){i=0;score=0;needs=[];emp=false;hist=[];show(false);return;}
  if(t.dataset.share){share(t);return;}
  if(lock)return;
  if(t.dataset.restart){i=0;score=0;needs=[];emp=false;hist=[];show(true);return;}
  if(t.dataset.back){var p=hist.pop();i=p.i;score=p.score;needs=p.needs;emp=p.emp;show(true);return;}
  if(t.dataset.k===undefined)return;
  lock=true;t.classList.add('sel');t.closest('.opts').setAttribute('data-picked','');
  var o=Q[i].o[+t.dataset.k];
  hist.push({i:i,score:score,needs:needs.slice(),emp:emp});
  score+=o[1];if(o[2])needs.push(o[2]);if(o[3])emp=true;
  setTimeout(function(){
    i++;
    if(i>=Q.length)result();else show(true);
  },170);
});
intro();
</script>
</body>
</html>
